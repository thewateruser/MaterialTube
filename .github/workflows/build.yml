name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.MATERIALTUBE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.MATERIALTUBE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APKs
        env:
          MATERIALTUBE_KEYSTORE: ${{ env.HAS_RELEASE_KEY == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          MATERIALTUBE_KEYSTORE_PASSWORD: ${{ secrets.MATERIALTUBE_KEYSTORE_PASSWORD }}
          MATERIALTUBE_KEY_ALIAS: ${{ secrets.MATERIALTUBE_KEY_ALIAS }}
          MATERIALTUBE_KEY_PASSWORD: ${{ secrets.MATERIALTUBE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Read version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/MaterialTube-release.apk
          cp app/build/outputs/apk/debug/*.apk out/MaterialTube-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MaterialTube-apk
          path: out/*.apk

      # Talks to the real YouTube API (anonymously) to catch breaking changes early.
      # Informational only: YouTube may rate-limit CI runners.
      - name: Live API smoke test
        continue-on-error: true
        env:
          MATERIALTUBE_LIVE_TEST: "1"
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'dev.materialtube.data.LiveApiTest' --rerun-tasks

      # Publishes on a pushed v* tag, a manual run, or a commit whose message contains [release].
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          target_commitish: ${{ github.sha }}
          name: MaterialTube ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          prerelease: true
          files: out/*.apk
          body: |
            YouTube client with Google sign-in that needs no MicroG, root or patched APK.

            **Install `MaterialTube-release.apk`.** Then open Library → Sign in, tap "Copy code & open google.com/device", paste the code and approve.

            `MaterialTube-debug.apk` is a debug build (larger, installs alongside as a separate app).

            Note: until a release keystore is configured (see README), each build is signed with a different key. Uninstall the previous version before installing a new one.
