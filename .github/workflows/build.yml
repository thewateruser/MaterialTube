name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.YTPLUS_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.YTPLUS_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APKs
        env:
          YTPLUS_KEYSTORE: ${{ env.HAS_RELEASE_KEY == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          YTPLUS_KEYSTORE_PASSWORD: ${{ secrets.YTPLUS_KEYSTORE_PASSWORD }}
          YTPLUS_KEY_ALIAS: ${{ secrets.YTPLUS_KEY_ALIAS }}
          YTPLUS_KEY_PASSWORD: ${{ secrets.YTPLUS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/YTPlus-release.apk
          cp app/build/outputs/apk/debug/*.apk out/YTPlus-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: YTPlus-apk
          path: out/*.apk

      # Talks to the real YouTube API (anonymously) to catch breaking changes early.
      # Informational only: YouTube may rate-limit CI runners.
      - name: Live API smoke test
        continue-on-error: true
        env:
          YTPLUS_LIVE_TEST: "1"
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'dev.ytplus.data.LiveApiTest' --rerun-tasks

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
